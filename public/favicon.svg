<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6AB65" />
      <stop offset="100%" stop-color="#D48C46" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D48C46" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#F7EBE1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F7EBE1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="64" height="64" rx="16" fill="#120E0C" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#D48C46" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Rising Steam Waves -->
  <path d="M 22 24 C 20 18, 26 14, 24 8" fill="none" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 32 22 C 30 16, 36 12, 34 6" fill="none" stroke="url(#steamGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 42 24 C 40 18, 46 14, 44 8" fill="none" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Steaming Cup Body & Handle -->
  <!-- Cup Handle -->
  <path d="M 44 32 C 52 32, 52 44, 44 44" fill="none" stroke="url(#cupGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Cup Base & Body -->
  <path d="M 16 28 L 44 28 L 40 46 C 39 49, 36 51, 30 51 C 24 51, 21 49, 20 46 Z" fill="url(#cupGrad)" />
  <!-- Saucer Base -->
  <path d="M 12 55 L 48 55" fill="none" stroke="url(#cupGrad)" stroke-width="3.5" stroke-linecap="round" />
</svg>
