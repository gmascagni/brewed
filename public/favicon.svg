<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="favMedBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2A1B10" />
      <stop offset="100%" stop-color="#0E0B08" />
    </radialGradient>
    <linearGradient id="favGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#D4A373" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="favLightRoast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="favDarkRoast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="60%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#favMedBg)" />
  <!-- Outer Beveled Gold Rim -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#favGoldRim)" stroke-width="4.5" />
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="#FDE68A" stroke-width="0.8" opacity="0.6" />
  <!-- Left Bean Half (Light Roast Amber) -->
  <path 
    d="M 50 14 C 28 14, 18 32, 20 54 C 22 72, 34 86, 50 86 C 44 76, 40 64, 48 48 C 54 36, 56 24, 50 14 Z" 
    fill="url(#favLightRoast)" 
  />
  <!-- Right Bean Half (Dark Roast Espresso) -->
  <path 
    d="M 50 14 C 56 24, 54 36, 48 48 C 40 64, 44 76, 50 86 C 66 86, 78 72, 80 54 C 82 32, 72 14, 50 14 Z" 
    fill="url(#favDarkRoast)" 
  />
  <!-- Fluid S-Curve Crevasse -->
  <path 
    d="M 50 14 C 56 24, 54 36, 48 48 C 40 64, 44 76, 50 86" 
    fill="none" 
    stroke="#0E0B08" 
    stroke-width="3.5" 
    stroke-linecap="round" 
  />
  <path 
    d="M 50 14 C 56 24, 54 36, 48 48 C 40 64, 44 76, 50 86" 
    fill="none" 
    stroke="url(#favGoldRim)" 
    stroke-width="1.2" 
    stroke-linecap="round" 
    opacity="0.8" 
  />
</svg>
