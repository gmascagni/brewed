<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheBrew.App — Official Brand Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B0D10;
      color: #F1F5F9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }
    .badge {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #D4A373;
      background: rgba(212, 163, 115, 0.1);
      border: 1px solid rgba(212, 163, 115, 0.3);
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #94A3B8;
      font-size: 15px;
      margin-bottom: 32px;
      max-width: 500px;
    }
    .card {
      background: #14110E;
      border: 2px solid rgba(212, 163, 115, 0.35);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 25px 60px -15px rgba(212, 163, 115, 0.25), 0 0 0 1px rgba(255,255,255,0.05);
      max-width: 520px;
      width: 100%;
    }
    .logo-img {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      display: block;
      margin: 0 auto;
    }
    .details {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-around;
      font-size: 12px;
      color: #CBD5E1;
    }
    .details div {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .details strong {
      color: #D4A373;
      font-size: 13px;
    }
    .btn-row {
      margin-top: 32px;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .btn {
      background: #D4A373;
      color: #0B0D10;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #FFF;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="badge">Official Brand Identity</div>
  <h1>TheBrew.App</h1>
  <p class="subtitle">Alchemy Harmony Edition — Specialty Coffee & Fine Tea Precision Guide</p>

  <div class="card">
    <img src="/images/thebrew_app_logo.jpg" alt="TheBrew.App Brand Logo" class="logo-img">
    <div class="details">
      <div>
        <span>COFFEE EMBLEM</span>
        <strong>Roasted Amber Droplet</strong>
      </div>
      <div>
        <span>TEA EMBLEM</span>
        <strong>Botanical Sage Leaf</strong>
      </div>
      <div>
        <span>WORDMARK</span>
        <strong>TheBrew.App</strong>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <a href="/" class="btn">Open TheBrew.App →</a>
    <a href="/images/thebrew_app_logo.jpg" target="_blank" class="btn btn-secondary">Open Full-Res Image ↗</a>
  </div>
</body>
</html>
